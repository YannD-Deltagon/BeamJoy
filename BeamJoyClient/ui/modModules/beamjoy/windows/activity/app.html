<style>
    #beamjoy-activity .bj-activity-phase {
        text-transform: uppercase;
        font-weight: bold;
        opacity: 0.8;
    }

    #beamjoy-activity .bj-activity-participant.eliminated {
        text-decoration: line-through;
        opacity: 0.6;
    }

    #beamjoy-activity .bj-activity-participant .position {
        font-weight: bold;
        margin-right: 0.4em;
    }

    #beamjoy-activity .bj-activity-details {
        margin-top: 0.4em;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        padding-top: 0.4em;
    }

    #beamjoy-activity .bj-activity-actions {
        margin-top: 0.5em;
        display: flex;
        gap: 0.5em;
        flex-wrap: wrap;
    }
</style>

<div id="beamjoy-activity" class="position-absolute pointer-events-none">
    <bj-window
        label="{{$ctrl.data.label}}"
        visible="$ctrl.data.visible"
        minimizable="true"
        closable="false"
        background="true"
    >
        <div class="pointer-events-all">
            <div class="bj-activity-phase">{{$ctrl.data.phase}}</div>

            <div class="bj-activity-participants">
                <div
                    class="bj-activity-participant"
                    ng-repeat="p in $ctrl.data.participants"
                    ng-class="{eliminated: p.eliminated}"
                >
                    <span class="position" ng-if="p.position">#{{p.position}}</span>
                    <span>{{p.name}}</span>
                    <span ng-if="$ctrl.data.phase === 'lobby'">
                        - {{p.ready ? "READY" : "..."}}
                    </span>
                </div>
            </div>

            <div class="bj-activity-details" ng-if="$ctrl.data.details.length">
                <div ng-repeat="d in $ctrl.data.details">
                    <span>{{d.label}}:</span>
                    <strong>{{d.value}}</strong>
                </div>
            </div>

            <div class="bj-activity-actions">
                <button
                    ng-if="!$ctrl.data.self.participant && $ctrl.data.phase === 'lobby'"
                    ng-click="$ctrl.action('join')"
                >
                    {{ 'beamjoy.activity.join' | translate }}
                </button>
                <button
                    ng-if="$ctrl.data.self.participant && !$ctrl.data.self.ready && $ctrl.data.phase === 'lobby'"
                    ng-click="$ctrl.action('ready')"
                >
                    {{ 'beamjoy.activity.ready' | translate }}
                </button>
                <button
                    ng-if="$ctrl.data.self.participant && $ctrl.data.phase === 'lobby'"
                    ng-click="$ctrl.action('leave')"
                >
                    {{ 'beamjoy.activity.leave' | translate }}
                </button>
                <button ng-if="$ctrl.data.canStop" ng-click="$ctrl.action('stop')">
                    {{ 'beamjoy.activity.stop' | translate }}
                </button>
            </div>
        </div>
    </bj-window>
</div>
